<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta name="theme-color" content="#06070c">
  <script src="scripts/theme.js"></script>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>
    Complete seu perfil — Praxis
  </title>
  <meta
    name="description"
    content="Escolha seu nome de usuário para continuar na Praxis."
  >
  <link
    rel="icon"
    type="image/png"
    href="assets/logo.png"
  >
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/login.css">
<link rel="stylesheet" href="styles/theme.css">
</head>
<body class="auth-page">
<header class="auth-topbar"><a class="auth-back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>Voltar para os cursos</a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar tema claro">
  <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
  <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
  <span class="theme-toggle__label" data-theme-label>Modo claro</span>
</button></header>

  <main class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img
          src="assets/logo.png"
          alt="Praxis"
          class="login-logo-img"
        >
      </div>
      <form
        class="login-form"
        id="profile-form"
        novalidate
      >
        <div class="profile-intro"><h1>Complete seu perfil</h1><p>Escolha um nome de usuário para continuar.</p></div>
        <div class="field">
          <label for="username">
            Nome de usuário
          </label>
          <div class="field-input">
            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
              />
              <circle
                cx="12"
                cy="7"
                r="4"
              />
            </svg>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Escolha seu nome de usuário"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9._]+"
              required
            >
          </div>
        </div>
        <div
          id="profile-msg"
          class="login-msg"
          aria-live="polite"
        ></div>
        <button
          type="submit"
          class="btn-login"
          id="profile-submit"
        >
          SALVAR E CONTINUAR
        </button>
        <div class="actions-group">
          <button
            type="button"
            class="btn-register"
            id="logout-btn"
          >
            Sair da conta
          </button>
        </div>
      </form>
    </div>
</main>
<footer class="auth-footer">Aprenda. Pratique. Resolva.</footer>
<script
    type="module"
    src="scripts/completar-perfil.js"
  ></script>
</body>
</html>
