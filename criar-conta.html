<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta name="theme-color" content="#06070c">
  <script src="scripts/theme.js"></script>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>
    Criar conta — Praxis
  </title>
  <meta
    name="description"
    content="Crie sua conta Praxis e comece a aprender."
  >
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/login.css">
<link rel="stylesheet" href="styles/theme.css">
</head>
<body class="auth-page">
<header class="auth-topbar"><a class="auth-back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>Voltar para os cursos</a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar tema claro">
  <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
  <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
  <span class="theme-toggle__label" data-theme-label>Modo claro</span>
</button></header>

  <main class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img
          src="assets/logo.png"
          alt="Praxis"
          class="login-logo-img"
        >
      </div>
<h1 class="auth-title">Crie sua conta</h1>
<p class="auth-subtitle">Comece sua jornada na Praxis.</p>
      <form
        class="login-form"
        id="register-form"
        novalidate
      >
        <div class="field">
          <label for="username">
            Nome de usuário
          </label>
          <div class="field-input">
            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
              />
              <circle
                cx="12"
                cy="7"
                r="4"
              />
            </svg>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Escolha seu nome de usuário"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9._]+"
              required
            >
          </div>
        </div>
        <div class="field">
          <label for="email">
            E-mail
          </label>
          <div class="field-input">
            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M4 4h16v16H4z"
              />
              <path
                d="m4 6 8 6 8-6"
              />
            </svg>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seu@email.com"
              required
            >
          </div>
        </div>
        <div class="field">
          <label for="password">
            Senha
          </label>
          <div class="field-input">
            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="11"
                rx="2"
              />
              <path
                d="M7 11V7a5 5 0 0 1 10 0v4"
              />
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crie uma senha"
              minlength="6"
              required
            >
            <button
              type="button"
              id="toggle-password"
              class="btn-toggle-pass"
              aria-label="Alternar exibição da senha"
              title="Ver ou ocultar senha"
            >
              <svg
                id="eye-off"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line
                  x1="1"
                  y1="1"
                  x2="23"
                  y2="23"
                ></line>
              </svg>
              <svg
                id="eye-on"
                class="hidden"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"
                ></path>
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm-password">
            Confirmar senha
          </label>
          <div class="field-input">
            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="11"
                rx="2"
              />
              <path
                d="M7 11V7a5 5 0 0 1 10 0v4"
              />
            </svg>
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              placeholder="Digite a senha novamente"
              minlength="6"
              required
            >
            <button
              type="button"
              id="toggle-confirm-password"
              class="btn-toggle-pass"
              aria-label="Alternar exibição da confirmação de senha"
              title="Ver ou ocultar senha"
            >
              <svg
                id="confirm-eye-off"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line
                  x1="1"
                  y1="1"
                  x2="23"
                  y2="23"
                ></line>
              </svg>
              <svg
                id="confirm-eye-on"
                class="hidden"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M1 12s4-8 11-8 11-8 11 8-4 8-11 8-11-8-11-8z"
                ></path>
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>
            </button>
          </div>
        </div>
        <div
          id="register-msg"
          class="login-msg"
          aria-live="polite"
        ></div>
        <button
          type="submit"
          class="btn-login"
          id="register-submit"
        >
          CRIAR CONTA
        </button>
        <div class="actions-group">
          <a
            href="login.html"
            class="btn-register"
          >
            Já tenho uma conta
          </a>
          <button
            type="button"
            class="google-btn"
            id="google-register-btn"
            aria-label="Continuar com Google"
            title="Continuar com Google"
          >
            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google"
            >
            <span>
              Continuar com Google
            </span>
          </button>
        </div>
      </form>
    </div>
</main>
<footer class="auth-footer">Aprenda. Pratique. Resolva.</footer>
<script>
    // Adiciona um evento que aguarda o HTML terminar de ser carregado.
    document.addEventListener(
      // Nome do evento disparado quando a estrutura HTML estiver pronta.
      "DOMContentLoaded",
      // Função executada depois que o DOM estiver carregado.
      () => {
        /* ===============================================
           SENHA PRINCIPAL
           controla o campo onde a senha é criada
        ================================================ */
        // Procura o botão responsável por mostrar ou ocultar a senha principal.
        const togglePassword =
          // Busca no documento um elemento através do seu ID.
          document.getElementById(
            // ID do botão de mostrar/ocultar senha.
            "toggle-password"
          );
        // Procura o campo da senha principal.
        const password =
          // Busca um elemento através do seu ID.
          document.getElementById(
            // ID do campo de senha.
            "password"
          );
        // Procura o ícone de olho aberto da senha principal.
        const eyeOn =
          // Busca o elemento através do ID.
          document.getElementById(
            // ID do ícone de olho aberto.
            "eye-on"
          );
        // Procura o ícone de olho riscado da senha principal.
        const eyeOff =
          // Busca o elemento através do ID.
          document.getElementById(
            // ID do ícone de olho riscado.
            "eye-off"
          );
        // Verifica se o botão e o campo realmente existem antes de adicionar o evento.
        if (
          // Confirma que togglePassword foi encontrado.
          togglePassword &&
          // Confirma que password foi encontrado.
          password
        ) {
          // Adiciona um evento de clique ao botão da senha principal.
          togglePassword.addEventListener(
            // Define que o evento observado será um clique.
            "click",
            // Função executada sempre que o botão for clicado.
            () => {
              // Cria uma variável que verifica se a senha está atualmente escondida.
              const isPassword =
                // Compara o tipo atual do campo.
                password.type ===
                // "password" significa que os caracteres estão escondidos.
                "password";
              // Altera o tipo do campo.
              password.type =
                // Verifica o valor verdadeiro ou falso armazenado em isPassword.
                isPassword
                  // Se estava escondida, muda para text e mostra a senha.
                  ? "text"
                  // Caso contrário, volta para password e esconde a senha.
                  : "password";
              // Tenta acessar o ícone de olho aberto e alternar sua classe hidden.
              eyeOn?.classList.toggle(
                // Nome da classe CSS que esconde o elemento.
                "hidden",
                // Define se a classe hidden deve permanecer ou ser removida.
                !isPassword
              );
              // Tenta acessar o ícone de olho riscado e alternar sua classe hidden.
              eyeOff?.classList.toggle(
                // Nome da classe que esconde o elemento.
                "hidden",
                // Esconde o olho riscado quando a senha estiver sendo exibida.
                isPassword
              );
            }
            // encerra a função executada ao clicar
          );
          // encerra o registro do evento de clique
        }
        // encerra a verificação da existência dos elementos
        /* ===============================================
           CONFIRMAR SENHA
           controla o segundo campo utilizado para
           confirmar a senha escolhida
        ================================================ */
        // Procura o botão de mostrar ou ocultar a confirmação da senha.
        const toggleConfirm =
          // Busca um elemento através do ID.
          document.getElementById(
            // ID do botão da confirmação.
            "toggle-confirm-password"
          );
        // Procura o campo onde a senha é digitada novamente.
        const confirmPassword =
          // Busca o elemento através do seu ID.
          document.getElementById(
            // ID do campo de confirmação.
            "confirm-password"
          );
        // Procura o ícone de olho aberto da confirmação.
        const confirmEyeOn =
          // Busca o elemento pelo ID.
          document.getElementById(
            // ID do olho aberto.
            "confirm-eye-on"
          );
        // Procura o ícone de olho riscado da confirmação.
        const confirmEyeOff =
          // Busca o elemento pelo ID.
          document.getElementById(
            // ID do olho riscado.
            "confirm-eye-off"
          );
        // Confirma que o botão e o campo existem antes de registrar o evento.
        if (
          // Verifica se o botão foi encontrado.
          toggleConfirm &&
          // Verifica se o campo foi encontrado.
          confirmPassword
        ) {
          // Adiciona um evento de clique ao botão da confirmação.
          toggleConfirm.addEventListener(
            // Define o clique como evento observado.
            "click",
            // Função executada quando o usuário clicar.
            () => {
              // Verifica se a confirmação está atualmente escondida.
              const isPassword =
                // Compara o tipo atual do input.
                confirmPassword.type ===
                // O tipo password significa que os caracteres estão escondidos.
                "password";
              // Altera o tipo do campo de confirmação.
              confirmPassword.type =
                // Verifica o estado atual.
                isPassword
                  // Se estava escondido, passa para texto.
                  ? "text"
                  // Se estava visível, volta para senha.
                  : "password";
              // Alterna a classe hidden do olho aberto.
              confirmEyeOn?.classList.toggle(
                // Classe responsável por esconder o elemento.
                "hidden",
                // Define quando o olho aberto deve ficar escondido.
                !isPassword
              );
              // Alterna a classe hidden do olho riscado.
              confirmEyeOff?.classList.toggle(
                // Classe responsável por esconder o elemento.
                "hidden",
                // Define quando o olho riscado deve ficar escondido.
                isPassword
              );
            }
            // encerra a função executada ao clicar
          );
          // encerra o registro do evento
        }
        // encerra a verificação da confirmação de senha
      }
      // encerra a função executada após o carregamento do DOM
    );
    // encerra o registro do evento DOMContentLoaded
  </script>
  <script
    type="module"
    src="scripts/criar-conta.js"
  ></script>
</body>
</html>
