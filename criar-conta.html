<script>
    // Adiciona um evento que aguarda o HTML terminar de ser carregado.

      // Nome do evento disparado quando a estrutura HTML estiver pronta.
      "DOMContentLoaded", // Fornece o texto “DOMContentLoaded” à expressão atual.

        /* ===============================================

        // Procura o botão responsável por mostrar ou ocultar a senha principal.
        const togglePassword = // Define togglePassword como o elemento cujo ID é o texto “toggle-password”.

          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “toggle-password”.
            // ID do botão de mostrar/ocultar senha.
            "toggle-password" // Fornece o texto “toggle-password” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Procura o campo da senha principal.
        const password = // Define password como o elemento cujo ID é o texto “password”.
          // Busca um elemento através do seu ID.
          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “password”.
            // ID do campo de senha.
            "password" // Fornece o texto “password” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Procura o ícone de olho aberto da senha principal.
        const eyeOn = // Define eyeOn como o elemento cujo ID é o texto “eye-on”.
          // Busca o elemento através do ID.
          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “eye-on”.
            // ID do ícone de olho aberto.
            "eye-on" // Fornece o texto “eye-on” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Procura o ícone de olho riscado da senha principal.
        const eyeOff = // Define eyeOff como o elemento cujo ID é o texto “eye-off”.
          // Busca o elemento através do ID.
          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “eye-off”.
            // ID do ícone de olho riscado.
            "eye-off" // Fornece o texto “eye-off” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Verifica se o botão e o campo realmente existem antes de adicionar o evento.
        if ( // Verifica togglePassword e password para decidir se executa este bloco.
          // Confirma que togglePassword foi encontrado.
          togglePassword && // Calcula togglePassword e password.
          // Confirma que password foi encontrado.
          password // Utiliza o valor de password.
        ) { // Verifica togglePassword e password para decidir se executa este bloco.
          // Adiciona um evento de clique ao botão da senha principal.
          togglePassword.addEventListener( // Executa a chamada que produz o registro do evento o texto “click” em togglePassword.
            // Define que o evento observado será um clique.
            "click", // Fornece o texto “click” à expressão atual.
            // Função executada sempre que o botão for clicado.
            () => { // Define a função que recebe nenhum argumento.
              // Cria uma variável que verifica se a senha está atualmente escondida.
              const isPassword = // Define isPassword como password.type igual, inclusive no tipo, a o texto “password”.
                // Compara o tipo atual do campo.
                password.type === // Acessa password.type.
                // "password" significa que os caracteres estão escondidos.
                "password"; // Fornece o texto “password” à expressão atual.
              // Altera o tipo do campo.
              password.type = // Atualiza password.type com o texto “text” se isPassword; caso contrário, o texto “password”.
                // Verifica o valor verdadeiro ou falso armazenado em isPassword.
                isPassword // Utiliza o valor de isPassword.
                  // Se estava escondida, muda para text e mostra a senha.
                  ? "text" // Fornece o texto “text” à expressão atual.
                  // Caso contrário, volta para password e esconde a senha.
                  : "password"; // Fornece o texto “password” à expressão atual.
              // Tenta acessar o ícone de olho aberto e alternar sua classe hidden.
              eyeOn?.classList.toggle( // Executa a chamada que produz a alternância da classe ou do estado o texto “hidden” em eyeOn.classList.
                // Nome da classe CSS que esconde o elemento.
                "hidden", // Fornece o texto “hidden” à expressão atual.
                // Define se a classe hidden deve permanecer ou ser removida.
                !isPassword // Compõe a negação de isPassword na operação atual.
              ); // Encerra a chamada de eyeOn.classList.toggle.
              // Tenta acessar o ícone de olho riscado e alternar sua classe hidden.
              eyeOff?.classList.toggle( // Executa a chamada que produz a alternância da classe ou do estado o texto “hidden” em eyeOff.classList.
                // Nome da classe que esconde o elemento.
                "hidden", // Fornece o texto “hidden” à expressão atual.

                isPassword // Utiliza o valor de isPassword.
              ); // Encerra a chamada de eyeOff.classList.toggle.
            } // Encerra o bloco atual.
            // encerra a função executada ao clicar
          ); // Encerra a chamada de togglePassword.addEventListener.
          // encerra o registro do evento de clique
        } // Encerra o bloco da condição.
        // encerra a verificação da existência dos elementos
        /* ===============================================

           controla o segundo campo utilizado para
           confirmar a senha escolhida
        ================================================ */
        // Procura o botão de mostrar ou ocultar a confirmação da senha.
        const toggleConfirm = // Define toggleConfirm como o elemento cujo ID é o texto “toggle-confirm-password”.
          // Busca um elemento através do ID.
          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “toggle-confirm-password”.
            // ID do botão da confirmação.
            "toggle-confirm-password" // Fornece o texto “toggle-confirm-password” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Procura o campo onde a senha é digitada novamente.
        const confirmPassword = // Define confirmPassword como o elemento cujo ID é o texto “confirm-password”.
          // Busca o elemento através do seu ID.
          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “confirm-password”.
            // ID do campo de confirmação.
            "confirm-password" // Fornece o texto “confirm-password” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Procura o ícone de olho aberto da confirmação.
        const confirmEyeOn = // Define confirmEyeOn como o elemento cujo ID é o texto “confirm-eye-on”.
          // Busca o elemento pelo ID.
          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “confirm-eye-on”.
            // ID do olho aberto.
            "confirm-eye-on" // Fornece o texto “confirm-eye-on” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Procura o ícone de olho riscado da confirmação.
        const confirmEyeOff = // Define confirmEyeOff como o elemento cujo ID é o texto “confirm-eye-off”.
          // Busca o elemento pelo ID.
          document.getElementById( // Executa a chamada que produz o elemento cujo ID é o texto “confirm-eye-off”.
            // ID do olho riscado.
            "confirm-eye-off" // Fornece o texto “confirm-eye-off” à expressão atual.
          ); // Encerra a chamada de document.getElementById.
        // Confirma que o botão e o campo existem antes de registrar o evento.
        if ( // Verifica toggleConfirm e confirmPassword para decidir se executa este bloco.
          // Verifica se o botão foi encontrado.
          toggleConfirm && // Calcula toggleConfirm e confirmPassword.
          // Verifica se o campo foi encontrado.
          confirmPassword // Utiliza o valor de confirmPassword.
        ) { // Verifica toggleConfirm e confirmPassword para decidir se executa este bloco.
          // Adiciona um evento de clique ao botão da confirmação.
          toggleConfirm.addEventListener( // Executa a chamada que produz o registro do evento o texto “click” em toggleConfirm.
            // Define o clique como evento observado.
            "click", // Fornece o texto “click” à expressão atual.
            // Função executada quando o usuário clicar.
            () => { // Define a função que recebe nenhum argumento.
              // Verifica se a confirmação está atualmente escondida.
              const isPassword = // Define isPassword como confirmPassword.type igual, inclusive no tipo, a o texto “password”.
                // Compara o tipo atual do input.
                confirmPassword.type === // Acessa confirmPassword.type.
                // O tipo password significa que os caracteres estão escondidos.
                "password"; // Fornece o texto “password” à expressão atual.
              // Altera o tipo do campo de confirmação.
              confirmPassword.type = // Atualiza confirmPassword.type com o texto “text” se isPassword; caso contrário, o texto “password”.
                // Verifica o estado atual.
                isPassword // Utiliza o valor de isPassword.
                  // Se estava escondido, passa para texto.
                  ? "text" // Fornece o texto “text” à expressão atual.
                  // Se estava visível, volta para senha.
                  : "password"; // Fornece o texto “password” à expressão atual.
              // Alterna a classe hidden do olho aberto.
              confirmEyeOn?.classList.toggle( // Executa a chamada que produz a alternância da classe ou do estado o texto “hidden” em confirmEyeOn.classList.
                // Classe responsável por esconder o elemento.
                "hidden", // Fornece o texto “hidden” à expressão atual.
                // Define quando o olho aberto deve ficar escondido.
                !isPassword // Compõe a negação de isPassword na operação atual.
              ); // Encerra a chamada de confirmEyeOn.classList.toggle.
              // Alterna a classe hidden do olho riscado.
              confirmEyeOff?.classList.toggle( // Executa a chamada que produz a alternância da classe ou do estado o texto “hidden” em confirmEyeOff.classList.
                // Classe responsável por esconder o elemento.
                "hidden", // Fornece o texto “hidden” à expressão atual.
