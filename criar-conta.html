<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>
    Criar conta — SkillUp
  </title>

  <meta
    name="description"
    content="Crie sua conta SkillUp e comece a aprender."
  />

  <link
    rel="icon"
    type="image/png"
    href="assets/logo.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="styles/login.css"
  />
</head>


<body>

  <img
    src="assets/vector1.png"
    alt=""
    class="bg-vector"
    aria-hidden="true"
  />


  <div class="login-wrap">

    <div class="login-card">


      <!-- =================================================
           LOGO
      ================================================== -->

      <div class="login-logo">

        <img
          src="assets/logo.png"
          alt="SkillUp"
          class="login-logo-img"
        >

      </div>


      <!-- =================================================
           FORMULÁRIO
      ================================================== -->

      <form
        class="login-form"
        id="register-form"
        novalidate
      >


        <!-- =================================================
             NOME DE USUÁRIO
        ================================================== -->

        <div class="field">

          <label for="username">
            Nome de usuário
          </label>

          <div class="field-input">

            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
              />

              <circle
                cx="12"
                cy="7"
                r="4"
              />
            </svg>


            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Escolha seu nome de usuário"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9._]+"
              required
            />

          </div>

        </div>


        <!-- =================================================
             E-MAIL
        ================================================== -->

        <div class="field">

          <label for="email">
            E-mail
          </label>

          <div class="field-input">

            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M4 4h16v16H4z"
              />

              <path
                d="m4 6 8 6 8-6"
              />
            </svg>


            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seu@email.com"
              required
            />

          </div>

        </div>


        <!-- =================================================
             SENHA
        ================================================== -->

        <div class="field">

          <label for="password">
            Senha
          </label>

          <div class="field-input">

            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="11"
                rx="2"
              />

              <path
                d="M7 11V7a5 5 0 0 1 10 0v4"
              />
            </svg>


            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crie uma senha"
              minlength="6"
              required
            />


            <button
              type="button"
              id="toggle-password"
              class="btn-toggle-pass"
              aria-label="Alternar exibição da senha"
              title="Ver ou ocultar senha"
            >

              <svg
                id="eye-off"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>

                <line
                  x1="1"
                  y1="1"
                  x2="23"
                  y2="23"
                ></line>
              </svg>


              <svg
                id="eye-on"
                class="hidden"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M1 12s4-8 11-8 11-8 11 8-4 8-11 8-11-8-11-8z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>

            </button>

          </div>

        </div>


        <!-- =================================================
             CONFIRMAR SENHA
        ================================================== -->

        <div class="field">

          <label for="confirm-password">
            Confirmar senha
          </label>

          <div class="field-input">

            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="11"
                rx="2"
              />

              <path
                d="M7 11V7a5 5 0 0 1 10 0v4"
              />
            </svg>


            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              placeholder="Digite a senha novamente"
              minlength="6"
              required
            />


            <button
              type="button"
              id="toggle-confirm-password"
              class="btn-toggle-pass"
              aria-label="Alternar exibição da confirmação de senha"
              title="Ver ou ocultar senha"
            >

              <svg
                id="confirm-eye-off"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>

                <line
                  x1="1"
                  y1="1"
                  x2="23"
                  y2="23"
                ></line>
              </svg>


              <svg
                id="confirm-eye-on"
                class="hidden"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M1 12s4-8 11-8 11-8 11 8-4 8-11 8-11-8-11-8z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>
              </svg>

            </button>

          </div>

        </div>


        <!-- =================================================
             MENSAGEM
        ================================================== -->

        <div
          id="register-msg"
          class="login-msg"
          aria-live="polite"
        ></div>


        <!-- =================================================
             CRIAR CONTA
        ================================================== -->

        <button
          type="submit"
          class="btn-login"
          id="register-submit"
        >
          CRIAR CONTA
        </button>


        <!-- =================================================
             AÇÕES
        ================================================== -->

        <div class="actions-group">


          <a
            href="login.html"
            class="btn-register"
          >
            Já tenho uma conta
          </a>


          <button
            type="button"
            class="google-btn"
            id="google-register-btn"
            aria-label="Continuar com Google"
            title="Continuar com Google"
          >

            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google"
            />

            <span>
              Continuar com Google
            </span>

          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =====================================================
       MOSTRAR / OCULTAR SENHAS
  ====================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        /* ===============================================
           SENHA PRINCIPAL
        ================================================ */

        const togglePassword =
          document.getElementById(
            "toggle-password"
          );


        const password =
          document.getElementById(
            "password"
          );


        const eyeOn =
          document.getElementById(
            "eye-on"
          );


        const eyeOff =
          document.getElementById(
            "eye-off"
          );


        if (
          togglePassword &&
          password
        ) {

          togglePassword.addEventListener(
            "click",
            () => {

              const isPassword =
                password.type ===
                "password";


              password.type =
                isPassword
                  ? "text"
                  : "password";


              eyeOn?.classList.toggle(
                "hidden",
                !isPassword
              );


              eyeOff?.classList.toggle(
                "hidden",
                isPassword
              );

            }
          );

        }


        /* ===============================================
           CONFIRMAR SENHA
        ================================================ */

        const toggleConfirm =
          document.getElementById(
            "toggle-confirm-password"
          );


        const confirmPassword =
          document.getElementById(
            "confirm-password"
          );


        const confirmEyeOn =
          document.getElementById(
            "confirm-eye-on"
          );


        const confirmEyeOff =
          document.getElementById(
            "confirm-eye-off"
          );


        if (
          toggleConfirm &&
          confirmPassword
        ) {

          toggleConfirm.addEventListener(
            "click",
            () => {

              const isPassword =
                confirmPassword.type ===
                "password";


              confirmPassword.type =
                isPassword
                  ? "text"
                  : "password";


              confirmEyeOn?.classList.toggle(
                "hidden",
                !isPassword
              );


              confirmEyeOff?.classList.toggle(
                "hidden",
                isPassword
              );

            }
          );

        }

      }
    );

  </script>


  <!-- =====================================================
       SUPABASE / CADASTRO
  ====================================================== -->

  <script
    type="module"
    src="scripts/criar-conta.js"
  ></script>

</body>

</html>
