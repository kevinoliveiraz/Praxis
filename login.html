<!doctype html><!-- Declara o documento como HTML5. -->
<html lang="pt-BR" data-theme="dark"><!-- Insere o documento HTML. -->
<head><!-- Insere as configurações e os recursos da página. -->
  <meta charset="utf-8"><!-- Configura os metadados da página: Define a codificação de caracteres como “utf-8”. -->
  <meta name="viewport" content="width=device-width, initial-scale=1"><!-- Configura os metadados da página: Define o nome da configuração ou do campo como “viewport”. Define o valor da configuração como “width=device-width, initial-scale=1”. -->
  <meta name="theme-color" content="#06070c"><!-- Configura os metadados da página: Define o nome da configuração ou do campo como “theme-color”. Define o valor da configuração como “#06070c”. -->
  <title>Login — Praxis</title><!-- Insere o título da página ou a descrição do SVG com o texto “Login — Praxis”. -->
  <meta name="description" content="Acesse sua conta Praxis e continue aprendendo na prática."><!-- Configura os metadados da página: Define o nome da configuração ou do campo como “description”. Define o valor da configuração como “Acesse sua conta Praxis e continue aprendendo na prática.”. -->
  <script src="scripts/theme.js"></script><!-- Carrega o script scripts/theme.js. -->
  <link rel="icon" href="assets/logo.png" type="image/png"><!-- Define o favicon da Praxis em assets/logo.png. -->
  <link rel="preconnect" href="https://fonts.googleapis.com"><!-- Prepara a conexão com https://fonts.googleapis.com. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><!-- Prepara a conexão com https://fonts.gstatic.com. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><!-- Carrega a folha de estilos https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap. -->
  <link rel="stylesheet" href="styles/tokens.css"><!-- Carrega a folha de estilos styles/tokens.css. -->
  <link rel="stylesheet" href="styles/login.css"><!-- Carrega a folha de estilos styles/login.css. -->
  <link rel="stylesheet" href="styles/theme.css"><!-- Carrega a folha de estilos styles/theme.css. -->
</head><!-- Encerra as configurações e os recursos da página. -->
<body class="auth-page login-page"><!-- Insere o conteúdo visível da página com as classes “auth-page login-page”. -->
  <header class="auth-topbar"><!-- Insere o cabeçalho com as classes “auth-topbar”. -->
    <a class="auth-back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>Voltar para os cursos</a><!-- Insere um link com as classes “auth-back” com o texto “Voltar para os cursos”. -->
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar tema claro"><!-- Insere um botão com as classes “theme-toggle”. -->
      <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg><!-- Insere um ícone ou desenho vetorial com as classes “theme-icon-light”. -->
      <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg><!-- Insere um ícone ou desenho vetorial com as classes “theme-icon-dark”. -->
      <span class="theme-toggle__label" data-theme-label>Modo claro</span><!-- Insere um trecho de texto em linha com as classes “theme-toggle__label” com o texto “Modo claro”. -->
    </button><!-- Encerra um botão. -->
  </header><!-- Encerra o cabeçalho. -->
  <main class="login-wrap"><!-- Insere o conteúdo principal com as classes “login-wrap”. -->
    <section class="login-card" aria-labelledby="auth-title"><!-- Insere uma seção de conteúdo com as classes “login-card”. -->
      <a class="login-logo" href="index.html" aria-label="Praxis — página inicial"><img src="assets/logo.png" alt="Praxis" class="login-logo-img" width="180" height="180"></a><!-- Insere um link com as classes “login-logo”. -->
      <h1 class="auth-title" id="auth-title">Entre na sua conta</h1><!-- Insere o título principal identificado por “auth-title” com o texto “Entre na sua conta”. -->
      <p class="auth-subtitle" id="auth-subtitle">Seu próximo passo começa aqui.</p><!-- Insere um parágrafo identificado por “auth-subtitle” com o texto “Seu próximo passo começa aqui.”. -->
      <form class="login-form" id="login-form" novalidate><!-- Insere um formulário identificado por “login-form”. -->
        <div class="field" id="email-field"><!-- Insere um contêiner de layout identificado por “email-field”. -->
          <label for="email">E-mail</label><!-- Insere um rótulo de campo com o texto “E-mail”. -->
          <div class="field-input"><!-- Insere um contêiner de layout com as classes “field-input”. -->
            <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" aria-describedby="login-msg" required><!-- Insere um campo de entrada identificado por “email”. -->
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><!-- Insere um ícone ou desenho vetorial com as classes “field-icon”. -->
          </div><!-- Encerra um contêiner de layout. -->
        </div><!-- Encerra um contêiner de layout. -->
        <div class="field" id="password-field"><!-- Insere um contêiner de layout identificado por “password-field”. -->
          <label for="password">Senha</label><!-- Insere um rótulo de campo com o texto “Senha”. -->
          <div class="field-input"><!-- Insere um contêiner de layout com as classes “field-input”. -->
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-describedby="login-msg" required><!-- Insere um campo de entrada identificado por “password”. -->
            <button type="button" id="toggle-password" class="btn-toggle-pass" data-password-toggle="password" aria-label="Mostrar senha" aria-pressed="false"><!-- Insere um botão identificado por “toggle-password”. -->
              <svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><!-- Insere um ícone ou desenho vetorial com as classes “password-eye”. -->
              <svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 5.1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.5M6.5 6.5A18 18 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5.5-1.5"/></svg><!-- Insere um ícone ou desenho vetorial com as classes “password-eye-off”. -->
            </button><!-- Encerra um botão. -->
          </div><!-- Encerra um contêiner de layout. -->
        </div><!-- Encerra um contêiner de layout. -->
        <div class="field" id="confirm-field" hidden><!-- Insere um contêiner de layout identificado por “confirm-field”. -->
          <label for="confirm-password">Confirmar nova senha</label><!-- Insere um rótulo de campo com o texto “Confirmar nova senha”. -->
          <div class="field-input"><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Repita sua nova senha" aria-describedby="login-msg" disabled></div><!-- Insere um contêiner de layout identificado por “confirm-password”. -->
        </div><!-- Encerra um contêiner de layout. -->
        <div class="login-options" id="login-options"><!-- Insere um contêiner de layout identificado por “login-options”. -->
          <label class="remember-email"><input type="checkbox" id="remember-email">Lembrar meu e-mail</label><!-- Insere um rótulo de campo identificado por “remember-email” com o texto “Lembrar meu e-mail”. -->
          <a class="forgot" href="login.html?modo=recuperar" id="forgot-password">Esqueci a senha</a><!-- Insere um link identificado por “forgot-password” com o texto “Esqueci a senha”. -->
        </div><!-- Encerra um contêiner de layout. -->
        <p id="login-msg" class="login-msg" aria-live="polite" aria-atomic="true"></p><!-- Insere um parágrafo identificado por “login-msg”. -->
        <button type="submit" class="btn-login" id="login-submit">Entrar</button><!-- Insere um botão identificado por “login-submit” com o texto “Entrar”. -->
        <div class="auth-divider" id="auth-divider"><span>ou continue com</span></div><!-- Insere um contêiner de layout identificado por “auth-divider” com o texto “ou continue com”. -->
        <button type="button" class="google-btn" id="google-btn"><!-- Insere um botão identificado por “google-btn”. -->
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285f4" d="M22.56 12.25c0-.73-.06-1.42-.19-2.09H12v3.96h5.92a5.05 5.05 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.76 3.28-7.95Z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.8l-3.56-2.76c-.98.66-2.24 1.06-3.72 1.06-2.87 0-5.3-1.94-6.17-4.54H2.15v2.85A11 11 0 0 0 12 23Z"/><path fill="#fbbc05" d="M5.83 13.96A6.6 6.6 0 0 1 5.5 12c0-.68.12-1.34.33-1.96V7.19H2.15A11 11 0 0 0 1 12c0 1.78.43 3.46 1.15 4.81l3.68-2.85Z"/><path fill="#ea4335" d="M12 5.5c1.62 0 3.06.56 4.21 1.64l3.16-3.16C17.46 2.2 14.97 1 12 1a11 11 0 0 0-9.85 6.19l3.68 2.85C6.7 7.44 9.13 5.5 12 5.5Z"/></svg><!-- Insere um ícone ou desenho vetorial. -->
          Continuar com Google<!-- Exibe o texto “Continuar com Google” neste ponto da página. -->
        </button><!-- Encerra um botão. -->
      </form><!-- Encerra um formulário. -->
      <p class="auth-register" id="auth-register">Ainda não tem uma conta? <a href="criar-conta.html">Cadastre-se</a></p><!-- Insere um parágrafo identificado por “auth-register” com o texto “Ainda não tem uma conta? Cadastre-se”. -->
      <a class="auth-return" id="auth-return" href="login.html" hidden>Voltar para o login</a><!-- Insere um link identificado por “auth-return” com o texto “Voltar para o login”. -->
    </section><!-- Encerra uma seção de conteúdo. -->
  </main><!-- Encerra o conteúdo principal. -->
  <footer class="auth-footer">Aprenda. Pratique. Resolva.</footer><!-- Insere o rodapé com as classes “auth-footer” com o texto “Aprenda. Pratique. Resolva.”. -->
  <script src="scripts/login-ui.js"></script><!-- Carrega o script scripts/login-ui.js. -->
</body><!-- Encerra o conteúdo visível da página. -->
</html><!-- Encerra o documento HTML. -->
