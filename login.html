<!doctype html>
<!-- informa ao navegador que este documento utiliza HTML5 -->

<html lang="pt-BR">
<!-- inicia o documento HTML e define o idioma principal como português do Brasil -->


<head>
<!-- inicia a área de configurações e informações da página -->


  <!-- define a codificação de caracteres como UTF-8 para aceitar acentos e caracteres especiais -->
  <meta charset="utf-8">


  <!--
    meta viewport:
    controla como a página será exibida em diferentes tamanhos de tela

    name="viewport":
    informa que esta configuração controla a área visível da página

    width=device-width:
    faz a largura da página acompanhar a largura do dispositivo

    initial-scale=1:
    inicia o zoom da página em 100%
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >


  <!-- inicia o título exibido na aba do navegador -->

  <!-- texto exibido na aba -->
  <title>
    
    Login — Praxis
  </title>
  <!-- encerra o título da página -->


  <!--
    define uma descrição resumida da página

    name="description":
    informa que esta meta tag contém a descrição da página

    content:
    contém o texto utilizado como descrição
  -->
  <meta
    name="description"
    content="Acesse sua conta Praxis e continue evoluindo."
  >


  <!--
    define o ícone exibido na aba do navegador

    rel="icon":
    informa que o arquivo será utilizado como ícone

    type="image/png":
    informa o formato da imagem

    href:
    informa o caminho da imagem
  -->
  <link
    rel="icon"
    type="image/png"
    href="assets/logo.png"
  >


  <!--
    prepara antecipadamente a conexão com o servidor
    utilizado para carregar os estilos do Google Fonts
  -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >


  <!--
    prepara a conexão com o servidor que fornece
    os arquivos físicos das fontes

    crossorigin:
    permite carregar recursos provenientes de outro domínio
  -->
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >


  <!--
    importa a fonte Inter através do Google Fonts

    href:
    contém o endereço da fonte e os pesos utilizados

    rel="stylesheet":
    informa que o recurso carregado é uma folha de estilos
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


  <!--
    importa o arquivo CSS responsável pelo visual da página de login

    rel="stylesheet":
    informa que o arquivo é uma folha de estilos

    href:
    define o caminho até o arquivo CSS
  -->
  <link
    rel="stylesheet"
    href="styles/login.css"
  >


</head>
<!-- encerra a área de configurações da página -->



<body>
<!-- inicia todo o conteúdo visual exibido para o usuário -->


  <!--
    exibe a imagem decorativa utilizada no plano de fundo

    src:
    caminho até a imagem

    alt vazio:
    indica que a imagem não precisa de descrição textual

    bg-vector:
    classe utilizada pelo CSS para posicionar a imagem

    aria-hidden:
    informa aos leitores de tela que a imagem é apenas decorativa
  -->
  <img
    src="assets/vector1.png"
    alt=""
    class="bg-vector"
    aria-hidden="true"
  >



  <!-- =====================================================
       ÁREA PRINCIPAL DO LOGIN

       envolve e posiciona o formulário de login na página
  ====================================================== -->


  <!-- cria o contêiner externo responsável pelo posicionamento do login -->
  <div class="login-wrap">


    <!-- cria o cartão que contém todos os elementos do login -->
    <div class="login-card">



      <!-- =================================================
           LOGO
      ================================================== -->


      <!-- cria a área destinada à logo -->
      <div class="login-logo">


        <!--
          exibe a logo da plataforma

          src:
          caminho da imagem

          alt:
          texto alternativo da imagem

          login-logo-img:
          classe utilizada pelo CSS para controlar a aparência da logo
        -->
        <img
          src="assets/logo.png"
          alt="Praxis"
          class="login-logo-img"
        >


      </div>
      <!-- encerra a área da logo -->



      <!-- =================================================
           FORMULÁRIO DE LOGIN
      ================================================== -->


      <!--
        cria o formulário utilizado para autenticação

        login-form:
        classe utilizada pelo CSS

        id="login-form":
        permite que o login.js encontre o formulário

        novalidate:
        desativa as mensagens automáticas de validação do navegador,
        permitindo que o JavaScript controle as mensagens
      -->
      <form
        class="login-form"
        id="login-form"
        novalidate
      >



        <!-- =================================================
             E-MAIL
        ================================================== -->


        <!-- cria o grupo do campo de e-mail -->
        <div class="field">


          <!--
            cria o texto que identifica o campo

            for="email":
            associa este label ao input que possui id="email"
          -->
          <label for="email">

            <!-- texto exibido acima do campo -->
            E-mail

          </label>


          <!-- agrupa o ícone e o campo de e-mail -->
          <div class="field-input">



            <!--
              cria o ícone de usuário

              icon-left:
              classe responsável pelo posicionamento do ícone

              width e height:
              definem o tamanho

              viewBox:
              define a área interna do SVG

              fill="none":
              remove o preenchimento

              stroke="currentColor":
              utiliza a cor atual para as linhas

              stroke-width:
              define a espessura das linhas
            -->
            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >


              <!-- desenha a parte inferior do ícone de usuário -->
              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
              />


              <!--
                desenha a cabeça do usuário

                cx e cy:
                definem a posição do centro

                r:
                define o raio
              -->
              <circle
                cx="12"
                cy="7"
                r="4"
              />


            </svg>
            <!-- encerra o ícone de usuário -->



            <!--
              cria o campo onde o usuário digita seu e-mail

              id:
              permite que o JavaScript encontre o campo

              name:
              identifica o valor dentro do formulário

              type="email":
              define que o conteúdo esperado é um endereço de e-mail

              autocomplete="email":
              permite que o navegador sugira e-mails armazenados

              placeholder:
              exibe um exemplo enquanto o campo estiver vazio

              required:
              informa que o preenchimento é obrigatório
            -->
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seu@email.com"
              required
            >


          </div>
          <!-- encerra o agrupamento do campo de e-mail -->


        </div>
        <!-- encerra o grupo do e-mail -->



        <!-- =================================================
             SENHA
        ================================================== -->


        <!-- cria o grupo do campo de senha -->
        <div class="field">


          <!-- associa o texto ao input que possui id="password" -->
          <label for="password">

            <!-- texto exibido acima do campo -->
            Senha

          </label>


          <!-- agrupa o ícone, campo de senha e botão de visualizar senha -->
          <div class="field-input">



            <!-- cria o ícone de cadeado -->
            <svg
              class="icon-left"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >


              <!-- desenha a parte inferior do cadeado -->
              <rect
                x="3"
                y="11"
                width="18"
                height="11"
                rx="2"
              />


              <!-- desenha a parte superior do cadeado -->
              <path
                d="M7 11V7a5 5 0 0 1 10 0v4"
              />


            </svg>
            <!-- encerra o ícone de cadeado -->



            <!--
              cria o campo onde a senha é digitada

              id:
              permite que o JavaScript encontre o campo

              name:
              identifica o valor da senha

              type="password":
              oculta visualmente os caracteres digitados

              autocomplete="current-password":
              informa ao navegador que este campo recebe a senha atual

              placeholder:
              exibe uma instrução enquanto estiver vazio

              required:
              torna o preenchimento obrigatório
            -->
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              required
            >



            <!--
              cria o botão responsável por mostrar ou esconder a senha

              type="button":
              impede que este botão envie o formulário

              id:
              permite que o JavaScript encontre o botão

              btn-toggle-pass:
              classe utilizada para sua aparência

              aria-label:
              descreve a função para leitores de tela

              title:
              mostra uma pequena informação ao passar o mouse
            -->
            <button
              type="button"
              id="toggle-password"
              class="btn-toggle-pass"
              aria-label="Alternar exibição da senha"
              title="Ver ou ocultar senha"
            >



              <!--
                cria o ícone de olho riscado

                este ícone representa inicialmente
                que a senha está escondida
              -->
              <svg
                id="eye-off"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >


                <!-- desenha a parte principal do olho riscado -->
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>


                <!-- desenha a linha diagonal que corta o olho -->
                <line
                  x1="1"
                  y1="1"
                  x2="23"
                  y2="23"
                ></line>


              </svg>
              <!-- encerra o ícone de olho riscado -->



              <!--
                cria o ícone de olho aberto

                id="eye-on":
                permite que o JavaScript encontre o ícone

                hidden:
                faz o ícone começar escondido
              -->
              <svg
                id="eye-on"
                class="hidden"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >


                <!-- desenha o contorno do olho -->
                <path
                  d="M1 12s4-8 11-8 11-8 11 8-4 8-11 8-11-8-11-8z"
                ></path>


                <!-- desenha a pupila -->
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>


              </svg>
              <!-- encerra o ícone de olho aberto -->


            </button>
            <!-- encerra o botão de mostrar/ocultar senha -->


          </div>
          <!-- encerra o agrupamento do campo de senha -->


        </div>
        <!-- encerra o grupo da senha -->



        <!-- =================================================
             ESQUECEU SUA SENHA
        ================================================== -->


        <!--
          cria o link destinado à recuperação de senha

          href="#":
          ainda não aponta para uma página específica

          forgot:
          classe responsável pelo estilo

          id:
          permite futura manipulação pelo JavaScript
        -->
        <a
          href="#"
          class="forgot"
          id="forgot-password"
        >

          <!-- texto exibido no link -->
          Esqueceu sua senha?

        </a>
        <!-- encerra o link de recuperação -->



        <!-- =================================================
             MENSAGENS DO LOGIN
        ================================================== -->


        <!--
          área utilizada pelo JavaScript para apresentar mensagens

          id="login-msg":
          permite que o login.js encontre o elemento

          login-msg:
          classe utilizada para estilização

          aria-live="polite":
          permite que mensagens novas sejam anunciadas
          por leitores de tela
        -->
        <div
          id="login-msg"
          class="login-msg"
          aria-live="polite"
        ></div>



        <!-- =================================================
             BOTÃO LOGIN
        ================================================== -->


        <!--
          cria o botão que envia o formulário

          type="submit":
          faz o botão disparar o evento submit do formulário

          btn-login:
          classe responsável pelo visual

          id="login-submit":
          permite que o login.js controle o botão
        -->
        <button
          type="submit"
          class="btn-login"
          id="login-submit"
        >

          <!-- texto exibido no botão -->
          LOGIN

        </button>
        <!-- encerra o botão de login -->



        <!-- =================================================
             AÇÕES ADICIONAIS
        ================================================== -->


        <!-- agrupa as opções Criar conta e Continuar com Google -->
        <div class="actions-group">



          <!--
            cria o link para cadastro de uma nova conta

            href:
            direciona para criar-conta.html

            btn-register:
            classe responsável pelo visual

            id:
            identifica este elemento
          -->
          <a
            href="criar-conta.html"
            class="btn-register"
            id="register-btn"
          >

            <!-- texto do link -->
            Criar conta

          </a>
          <!-- encerra o link para criação de conta -->



          <!--
            cria o botão de autenticação com Google

            type="button":
            evita o envio do formulário tradicional

            google-btn:
            classe responsável pelo visual

            id="google-btn":
            permite que login.js encontre o botão

            aria-label:
            descreve sua função para tecnologias assistivas

            title:
            fornece uma descrição adicional ao passar o mouse
          -->
          <button
            type="button"
            class="google-btn"
            id="google-btn"
            aria-label="Continuar com Google"
            title="Continuar com Google"
          >



            <!--
              carrega o ícone oficial utilizado no botão do Google

              src:
              endereço da imagem

              alt:
              texto alternativo da imagem
            -->
            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google"
            >



            <!-- envolve o texto do botão -->
            <span>

              <!-- texto exibido -->
              Continuar com Google

            </span>
            <!-- encerra o texto -->


          </button>
          <!-- encerra o botão de login com Google -->


        </div>
        <!-- encerra o agrupamento das ações -->


      </form>
      <!-- encerra o formulário de login -->


    </div>
    <!-- encerra o cartão do login -->


  </div>
  <!-- encerra o contêiner principal do login -->



  <!-- =====================================================
       MOSTRAR / OCULTAR SENHA

       este JavaScript controla exclusivamente a troca
       entre senha escondida e senha visível
  ====================================================== -->


  <!-- inicia o JavaScript executado diretamente nesta página -->
  <script>


    // Aguarda todo o HTML da página ser carregado antes de procurar os elementos.
    document.addEventListener(

      // Nome do evento disparado quando o HTML terminou de ser carregado.
      "DOMContentLoaded",

      // Função executada quando o evento DOMContentLoaded acontecer.
      () => {


        // Procura no HTML o botão responsável por mostrar ou esconder a senha.
        const toggleBtn =

          // Busca um elemento através do seu id.
          document.getElementById(

            // ID do botão que controla a visibilidade da senha.
            "toggle-password"

          );


        // Procura o campo onde a senha é digitada.
        const passInput =

          // Busca o elemento através do seu id.
          document.getElementById(

            // ID do campo de senha.
            "password"

          );


        // Procura o SVG que representa o olho aberto.
        const eyeOn =

          // Busca o elemento através do seu id.
          document.getElementById(

            // ID do ícone de olho aberto.
            "eye-on"

          );


        // Procura o SVG que representa o olho riscado.
        const eyeOff =

          // Busca o elemento através do seu id.
          document.getElementById(

            // ID do ícone de olho riscado.
            "eye-off"

          );



        // Verifica se o botão e o campo de senha realmente existem na página.
        if (

          // Confirma a existência do botão.
          toggleBtn &&

          // Confirma a existência do campo de senha.
          passInput

        ) {


          // Adiciona um evento de clique ao botão.
          toggleBtn.addEventListener(

            // Define que o evento observado é um clique.
            "click",

            // Função executada toda vez que o botão for clicado.
            () => {


              // Verifica se o campo está atualmente configurado como password.
              const isPassword =

                // Retorna true quando a senha estiver escondida.
                passInput.type ===

                // Valor utilizado pelo navegador para campos de senha.
                "password";



              // Altera o tipo do campo de acordo com o estado atual.
              passInput.type =

                // Verifica o resultado armazenado em isPassword.
                isPassword

                  // Se estava escondida, transforma em texto para mostrar a senha.
                  ? "text"

                  // Se estava visível, volta para password e esconde a senha.
                  : "password";



              // Alterna a classe hidden do ícone de olho aberto.
              eyeOn.classList.toggle(

                // Nome da classe CSS que esconde o elemento.
                "hidden",

                // Mantém o olho aberto escondido quando a senha não deve aparecer.
                !isPassword

              );



              // Alterna a classe hidden do ícone de olho riscado.
              eyeOff.classList.toggle(

                // Nome da classe CSS responsável por esconder o elemento.
                "hidden",

                // Esconde o olho riscado quando a senha está sendo exibida.
                isPassword

              );


            }
            // encerra a função executada ao clicar no botão

          );
          // encerra o registro do evento de clique


        }
        // encerra a verificação da existência dos elementos


      }
      // encerra a função executada depois que o HTML carregar

    );
    // encerra o registro do evento DOMContentLoaded


  </script>
  <!-- encerra o JavaScript de mostrar/ocultar senha -->



  <!-- =====================================================
       JAVASCRIPT PRINCIPAL DO LOGIN

       login.js será responsável pela autenticação,
       sessão, login por e-mail/senha e login pelo Google
  ====================================================== -->


  <!--
    type="module":
    permite que login.js utilize import e export

    src:
    informa o caminho até o arquivo JavaScript
  -->
  <script
    type="module"
    src="scripts/login.js"
  ></script>



</body>
<!-- encerra todo o conteúdo visual da página -->


</html>
<!-- encerra o documento HTML -->
