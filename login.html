<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06070c">
  <title>Login — Praxis</title>
  <meta name="description" content="Acesse sua conta Praxis e continue aprendendo na prática.">
  <script src="scripts/theme.js"></script>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/login.css">
  <link rel="stylesheet" href="styles/theme.css">
</head>
<body class="auth-page login-page">
  <header class="auth-topbar">
    <a class="auth-back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>Voltar para os cursos</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar tema claro">
      <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
      <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
      <span class="theme-toggle__label" data-theme-label>Modo claro</span>
    </button>
  </header>
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="auth-title">
      <a class="login-logo" href="index.html" aria-label="Praxis — página inicial"><img src="assets/logo.png" alt="Praxis" class="login-logo-img" width="180" height="180"></a>
      <h1 class="auth-title" id="auth-title">Entre na sua conta</h1>
      <p class="auth-subtitle" id="auth-subtitle">Seu próximo passo começa aqui.</p>
      <form class="login-form" id="login-form" novalidate>
        <div class="field" id="email-field">
          <label for="email">E-mail</label>
          <div class="field-input">
            <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" aria-describedby="login-msg" required>
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>
        <div class="field" id="password-field">
          <label for="password">Senha</label>
          <div class="field-input">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-describedby="login-msg" required>
            <button type="button" id="toggle-password" class="btn-toggle-pass" data-password-toggle="password" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 5.1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.5M6.5 6.5A18 18 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5.5-1.5"/></svg>
            </button>
          </div>
        </div>
        <div class="field" id="confirm-field" hidden>
          <label for="confirm-password">Confirmar nova senha</label>
          <div class="field-input"><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Repita sua nova senha" aria-describedby="login-msg" disabled></div>
        </div>
        <div class="login-options" id="login-options">
          <label class="remember-email"><input type="checkbox" id="remember-email">Lembrar meu e-mail</label>
          <a class="forgot" href="login.html?modo=recuperar" id="forgot-password">Esqueci a senha</a>
        </div>
        <p id="login-msg" class="login-msg" aria-live="polite" aria-atomic="true"></p>
        <button type="submit" class="btn-login" id="login-submit">Entrar</button>
        <div class="auth-divider" id="auth-divider"><span>ou continue com</span></div>
        <button type="button" class="google-btn" id="google-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285f4" d="M22.56 12.25c0-.73-.06-1.42-.19-2.09H12v3.96h5.92a5.05 5.05 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.76 3.28-7.95Z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.8l-3.56-2.76c-.98.66-2.24 1.06-3.72 1.06-2.87 0-5.3-1.94-6.17-4.54H2.15v2.85A11 11 0 0 0 12 23Z"/><path fill="#fbbc05" d="M5.83 13.96A6.6 6.6 0 0 1 5.5 12c0-.68.12-1.34.33-1.96V7.19H2.15A11 11 0 0 0 1 12c0 1.78.43 3.46 1.15 4.81l3.68-2.85Z"/><path fill="#ea4335" d="M12 5.5c1.62 0 3.06.56 4.21 1.64l3.16-3.16C17.46 2.2 14.97 1 12 1a11 11 0 0 0-9.85 6.19l3.68 2.85C6.7 7.44 9.13 5.5 12 5.5Z"/></svg>
          Continuar com Google
        </button>
      </form>
      <p class="auth-register" id="auth-register">Ainda não tem uma conta? <a href="criar-conta.html">Cadastre-se</a></p>
      <a class="auth-return" id="auth-return" href="login.html" hidden>Voltar para o login</a>
    </section>
  </main>
  <footer class="auth-footer">Aprenda. Pratique. Resolva.</footer>
  <script src="scripts/login-ui.js"></script>
</body>
</html>
